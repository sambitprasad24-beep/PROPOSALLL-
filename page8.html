<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#0f172a,#4c1d95);
overflow:hidden;
font-family:Arial,sans-serif;
}

.container{
text-align:center;
color:white;
animation:fade 2s ease;
padding:20px;
}

img{
width:320px;
max-width:90%;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.25);
margin-bottom:30px;
}

h1{
font-size:50px;
margin-bottom:20px;
}

p{
font-size:22px;
line-height:1.8;
margin-bottom:40px;
}

button{
padding:16px 40px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
font-weight:bold;
background:white;
color:#4c1d95;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<div class="container">

<img src="hug.gif" alt="Hug">

<h1>Thank You ❤️</h1>

<p>
Thank you for giving us another chance.<br>
I promise to love, respect and cherish you every single day.<br><br>
This isn't the end...
I have one last surprise waiting for you. ❤️
</p>

<button onclick="location.href='page9.html'">
🎁 Final Surprise ❤️
</button>

</div>

</body>
</html>
