<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Forever ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#4c1d95);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:900px;
    text-align:center;
    color:white;
    animation:fade 1.5s ease;
}

h1{
    font-size:50px;
    margin-bottom:25px;
}

video{
    width:100%;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,.25);
}

.caption{
    margin-top:20px;
    font-size:38px;
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 0 10px #fff,0 0 20px #ff66c4;
    animation:glow 2s ease-in-out infinite alternate;
}

p{
    margin-top:20px;
    font-size:22px;
    line-height:1.7;
}

button{
    margin-top:35px;
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:50px;
    background:white;
    color:#4c1d95;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #fff,0 0 20px #ff66c4;
    }
    to{
        text-shadow:0 0 20px #fff,0 0 40px #ff66c4;
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ One Last Surprise ❤️</h1>

<video controls autoplay>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<h2 class="caption">🧿 MAHHH DRAMAQUEEN 🫶</h2>

<p>
Thank you for watching till the end. ❤️<br>
No matter what happens, you'll always be my favorite person.
</p>

<button onclick="alert('I Love You ❤️')">❤️ Forever ❤️</button>

</div>

</body>
</html>
