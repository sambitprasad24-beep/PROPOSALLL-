<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAYUSHI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#4c1d95);
overflow:hidden;
}

/* Sparkles */

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 80% 25%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 30% 80%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 70% 70%,rgba(255,255,255,.15) 2px,transparent 3px);
background-size:220px 220px;
animation:move 15s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-220px);}
}

/* Laptop Container */

.container{
position:relative;
z-index:10;
width:1200px;
height:680px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Name */

.word{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.letter{
width:120px;
height:180px;
border-radius:20px;
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
font-size:75px;
font-weight:bold;
color:white;
text-shadow:0 3px 10px rgba(0,0,0,.5);
box-shadow:0 12px 25px rgba(0,0,0,.35);
transition:.3s;
}

.letter:hover{
transform:scale(1.05);
}

/* Photos */

.a1{
background-image:url("photo1.jpg");
}

.a2{
background-image:url("photo2.jpg");
}

.y{
background-image:url("photo3.jpg");
}

.u{
background-image:url("photo4.jpg");
}

.s{
background-image:url("photo2.jpg");
}

.h{
background-image:url("photo1.jpg");
}

.i{
background-image:url("photo3.jpg");
}

/* Button */

button{
margin-top:80px;
padding:16px 50px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:50px;
background:white;
color:#4c1d95;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@media(max-width:900px){

.container{
width:95%;
height:auto;
padding:30px;
}

.word{
gap:10px;
}

.letter{
width:75px;
height:110px;
font-size:45px;
}

button{
font-size:18px;
padding:14px 35px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="word">

<div class="letter a1">A</div>
<div class="letter a2">A</div>
<div class="letter y">Y</div>
<div class="letter u">U</div>
<div class="letter s">S</div>
<div class="letter h">H</div>
<div class="letter i">I</div>

</div>

<button onclick="location.href='page3.html'">
Continue →
</button>

</div>

</body>
</html>
