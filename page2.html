<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAYUSHI ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#0f172a,#4c1d95);
overflow:hidden;
font-family:Arial,sans-serif;
}

img{
width:90%;
max-width:1500px;
animation:zoom 1.5s ease;
}

button{
margin-top:50px;
padding:16px 45px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:50px;
background:white;
color:#4c1d95;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes zoom{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>
</head>
