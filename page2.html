<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAYUSHI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#4c1d95);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 80% 30%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 30% 80%,rgba(255,255,255,.15) 2px,transparent 3px),
radial-gradient(circle at 70% 70%,rgba(255,255,255,.15) 2px,transparent 3px);
background-size:220px 220px;
animation:move 15s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-220px);}
}

.container{
position:relative;
z-index:10;
text-align:center;
}

img{
width:900px;
max-width:95%;
}

button{
margin-top:35px;
padding:16px 55px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:50px;
background:white;
color:#4c1d95;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

</style>

</head>

<body>

<div class="container">

<img src="aayushi.png" alt="AAYUSHI">

<br>

<button onclick="location.href='page3.html'">
Continue →
</button>

</div>

</body>
