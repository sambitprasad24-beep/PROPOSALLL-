<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#0f172a,#4c1d95);
overflow:hidden;
}

h1{
font-family:'Cinzel',serif;
font-size:120px;
letter-spacing:15px;
color:white;
text-shadow:0 0 20px rgba(255,255,255,.5);
animation:glow 2s ease-in-out infinite alternate;
}

button{
margin-top:60px;
padding:16px 45px;
border:none;
border-radius:50px;
font-size:22px;
font-weight:bold;
cursor:pointer;
background:white;
color:#4c1d95;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes glow{
from{
text-shadow:0 0 10px white,0 0 20px #c084fc;
}
to{
text-shadow:0 0 25px white,0 0 50px #c084fc;
}
}
